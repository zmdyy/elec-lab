name: Circuit regression
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline regression suite
        run: |
          node tests/circuit-regression.cjs
          node tests/classroom-regression.cjs
          node tests/flow-regression.cjs
          node tests/devices-regression.cjs
          node tests/interface-regression.cjs
          node tests/wire-editor-regression.cjs
